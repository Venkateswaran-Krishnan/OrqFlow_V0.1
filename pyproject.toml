[project]
name = "framework"
version = "0.1.8"
description = "LangGraph-first automation framework skeleton for Playwright-driven RPA flows."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "mysql-connector-python>=9.0",
  "openpyxl>=3.1",
  "pandas>=2.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45",
]

[project.scripts]
framework = "framework.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["framework*"]
